# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: mambaforge-latest
  jobs:
    pre_build:
      - conda run --name $READTHEDOCS_VERSION pip install -e . --no-deps
      - conda list -n $READTHEDOCS_VERSION
      # Execute the example notebooks in parallel before the build. mkdocs-jupyter
      # is configured with execute:false and renders these outputs; docs/hooks.py
      # stages examples/ into docs/examples/ during the build.
      #
      # --workers is pinned rather than left at the script's default of
      # cpu_count()-1: os.cpu_count() reports the build host's CPUs, not the
      # container's quota, so the default oversubscribes and the kernels thrash.
      #
      # Notebooks needing credentials (CDS / Earth Data Hub), a large ERA5
      # download, or a purchased power-curve dataset are excluded by the
      # script's own defaults, as is one recipe notebook whose paths are
      # placeholders; see DEFAULT_EXCLUDED in docs/scripts/execute_notebooks.py.
      - conda run --name $READTHEDOCS_VERSION python docs/scripts/execute_notebooks.py --workers 2

    build:
      html:
        - conda run --name $READTHEDOCS_VERSION mkdocs build --site-dir $READTHEDOCS_OUTPUT/html

conda:
  environment: requirements.yml

mkdocs:
  configuration: mkdocs.yml
