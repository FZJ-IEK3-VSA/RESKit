on:
  workflow_dispatch:
  pull_request:
    branches: ["dev"]

jobs:
  extract-python-versions:
    if: github.actor != 'renovate[bot]'
    uses: FZJ-IEK3-VSA/.github/.github/workflows/extract_versions.yml@v1
    with:
      libraries: "python"
      env_file: requirements-dev.yml

  TestPullCondaForgeDev:
    name: Test development version on ${{ matrix.runner_tag }}
    needs: extract-python-versions
    if: github.actor != 'renovate[bot]'
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python_version: ${{ fromJSON(needs.extract-python-versions.outputs.versions) }}
    uses: FZJ-IEK3-VSA/.github/.github/workflows/run_conda_forge_test.yml@v1
    secrets: inherit
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements-dev.yml
      ipynb_example_folder: "examples"
      library_name: "python"
      library_version: ${{ matrix.python_version }}
      dependency_position_env_file: ${{ needs.extract-python-versions.outputs.dependency_position }}
      multiprocessing_pytest_string: "-n auto"
      multiprocessing_example_string: "-n 2"

  extract-min-versions:
    if: github.actor != 'renovate[bot]'
    uses: FZJ-IEK3-VSA/.github/.github/workflows/extract_versions.yml@v1
    with:
      libraries: "pandas,numpy,scipy,scikit-learn,geokit,netcdf4,xarray,numba"
      version_type: min
      env_file: requirements-dev.yml

  TestMinDependencies:
    needs: extract-min-versions
    if: github.actor != 'renovate[bot]'
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["self-hosted"]
        dependencies: ${{ fromJSON(needs.extract-min-versions.outputs.matrix) }}
    uses: FZJ-IEK3-VSA/.github/.github/workflows/run_conda_forge_test.yml@v1
    secrets: inherit
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements-dev.yml
      ipynb_example_folder: "examples"
      library_name: ${{ matrix.dependencies.library_name }}
      library_version: ${{ matrix.dependencies.version }}
      dependency_position_env_file: ${{ matrix.dependencies.yaml_position }}
      multiprocessing_pytest_string: "-n auto"
      multiprocessing_example_string: "-n 2"
