on:
  workflow_dispatch:
  push:
    branches: ["202-test-valid-dependency-range-for-reskit-43"]
  pull_request:
    branches: ["master"]

jobs:
  TestPushCondaForgeDev:
    name: Test conda-forge development version on ${{ matrix.runner_tag }} for pandas=${{ matrix.pandas_version }}
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["self-hosted"]
        # runner_tag: ["ubuntu-latest", "macos-latest", "windows-latest"]
        pandas_version:
          [
            "2.3.3",
            "2.3.2",
            "2.3.1",
            "2.3.0",
            "2.2.3",
            "2.2.2",
            "2.2.1",
            "2.2.0",
            "2.1.4",
            "2.1.3",
            "2.1.2",
            "2.1.1",
            "2.1.0",
            "2.0.3",
            "2.0.2",
            "2.0.1",
            "2.0.0",
            "1.5.3",
            "1.5.2",
            "1.5.1",
            "1.5.0",
            "1.4.4",
            "1.4.3",
            "1.4.2",
            "1.4.1",
            "1.4.0",
            "1.3.5",
            "1.3.4",
          ]
    uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements-dev.yml
      ipynb_example_folder: "Examples"
      library_name: "pandas"
      library_version: ${{ matrix.pandas_version }}
      dependency_position_env_file: "6"
