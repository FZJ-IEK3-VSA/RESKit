name: reskit_env
channels:
  - conda-forge
dependencies:
  - python >=3.11,<=3.12.12
  - papermill <=2.7.0
  - jupyter <=1.1.1
  - pip <=26.1.2
  - matplotlib <=3.10.5
  - descartes <=1.1.0
  - pandas >=2.0.0,<=2.3.3
  - openpyxl <=3.1.5
  - numpy >=1.25.0,<=1.26.4
  - numba >=0.58.1,<=0.65.1
  - scipy >=1.9.3,<=1.14.1
  - scikit-learn >=1.3.0,<=1.9.0
  - geokit >=1.6.0,<=1.9.0
  - netcdf4 >=1.6.4,<=1.7.4
  - xarray >=2024.3.0,!=2025.9.1,<=2026.4.0
  - zarr >=2.18.3,<3
  - gcsfs >=2024.10.0
  - pvlib-python >=0.10.0,<=0.15.2
  - windpowerlib =0.2.1
  - cdsapi <=0.7.7
  - wisdem <=4.2.1
  - openmdao
  - windio
  - orbit-nrel
  - jsonmerge
  - wombat
  # dev
  - nbval <=0.11.0
  - ruff =0.14.1
  - pytest <=9.1.1
  - pytest-cov <=7.1.0
  - pytest-xdist <=3.8.0
  # Documentation (MkDocs)
  - mkdocs >=1.6,<1.7
  - mkdocs-material >=9.5
  - mkdocstrings >=0.25
  - mkdocstrings-python >=1.10
  - mkdocs-jupyter >=0.25
  - mkdocs-gen-files >=0.5
  - mkdocs-literate-nav >=0.6
  - mkdocs-section-index >=0.3
  - griffe >=0.45
  - codespell <2.4.1
