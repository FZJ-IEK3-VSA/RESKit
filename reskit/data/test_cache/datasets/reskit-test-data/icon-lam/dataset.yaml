title: RESKit ICON-LAM test fixtures (FZJ ICON-LAM, southern Africa, clipped)
description: 'Nine variables of kilometre-scale ICON-LAM output over Bulawayo, Zimbabwe:
  14 x 11 cells of the 0.033 deg grid and 144 quarter-hourly steps, 2019-03-01 00:00
  to 2019-03-02 11:45. Cut from the same regridded simulation as icon-lam-southern-africa
  (Chen et al. 2024), produced at Forschungszentrum Julich.'
ethos:exclude:
- '**/__init__.py'
ethos:remote_prefix: reskit-test-data/icon-lam
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'ICON-NWP v2.6.4 in limited-area mode (ICON-LAM), 3.3 km native
  grid over the SASSCAL southern Africa domain, driven by DWD''s 13 km global ICON
  analysis, run on JSC JUWELS under project cjibg36. Per-variable processing and the
  conservative remap (cdo remapcon) to a regular 0.033 deg lon/lat grid are the same
  as for icon-lam-southern-africa -- see its ethos:derivation -- including the 10
  m wind speed from the components, sqrt(u_10m^2 + v_10m^2), and the power-law 100
  m wind speed. Taken from the untiled 2017-2019 files, not from the tiles.

  Then, as recorded in the CF history: cdo -L selyear,2019 -selmonth,3 (2023-07-28);
  cdo seltimestep,1/144 (2025-03-10); and a clip to 14 x 11 cells over Bulawayo, cell
  centres 28.328-28.757 E by 19.983-20.313 S. The clip is not in the history -- no
  CDO step for it -- so the window is given here from the coordinates.

  Variables are renamed to RESKit''s ERA5 convention -- blh, d2m, fdir, fsr, sp, ssrd,
  t2m, ws10, ws100 -- which is why these files look like ERA5 at a glance. They are
  not.

  The time axis is "days since 2017-01-01" and starts at 789.0, which is 2019-03-01
  00:00, so it agrees with the 2019-03 in the filenames. An earlier version of this
  note called that an oddity; it is not one.'
ethos:additional_variables:
  blh: Planetary boundary-layer height [m], diagnosed offline by the bulk Richardson
    number method from 3D u, v, virtual potential temperature and model-level heights.
  d2m: 2 m dew-point temperature [K], ICON td_2m.
  fdir: 'Direct horizontal irradiance [W m-2]: downward minus diffuse downward shortwave,
    sob_s + sou_s - sodifd_s.'
  fsr: Surface roughness length [m], ICON gz0.
  sp: Surface pressure [Pa], ICON pres_sfc.
