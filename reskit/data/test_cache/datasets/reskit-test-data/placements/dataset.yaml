title: RESKit turbine and module placement tables
description: Turbine and PV module positions for the Aachen region and for Bulawayo,
  as a shapefile and as CSV tables. What the workflow tests simulate at.
ethos:remote_prefix: reskit-test-data/placements
ethos:access: public
ethos:visibility: public
ethos:origin: created
ethos:derivation: 'turbinePlacements.shp is 560 points; turbine_placements.csv and
  module_placements.csv carry the identical coordinates with turbine and module attributes
  attached. The two _cityBulawayoInZimbabwa tables are 44 turbines and 483 modules
  around Bulawayo.

  The two _cityBulawayoInZimbabwa_2025 tables are those two tables as RESKit committed
  them on 2025-07-10 (466d8d99), before they were re-derived, converted from CRLF to
  LF without changing a value. RESKit''s ICON-LAM regression tests simulate them, so
  that a change of the tables above cannot move the expected values. Like the rest of
  this member they are under CC BY 4.0.

  The coordinates are ICE-2''s; what they were sampled inside is the question this
  member had to answer -- see ethos:license_note.

  Line endings: every table is stored with LF since 2026-09-18. The two _cityBulawayoInZimbabwa
  tables had been CRLF and were converted without changing a value, so their checksums
  in this manifest date from that conversion. The RESKit repository forbids line-ending
  conversion for the whole fixture tree (.gitattributes).'
