title: RESKit CM SAF SARAH-2 test fixtures, Aachen
description: Surface incoming shortwave and direct normal irradiance from the EUMETSAT
  CM SAF SARAH-2 climate data record, 51 x 61 cells over Aachen, 48 timesteps of January
  2015.
ethos:exclude:
- '**/__init__.py'
ethos:remote_prefix: reskit-test-data/sarah
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'Ordered from the CM SAF web interface -- the CF history carries
  the order path `/cmsaf/cmsaf-ops7/runsystem/orders/order_36443/` -- then `cdo sellonlatbox,5.0,7.5,49,52`
  and `seltimestep,0/48`.

  The files name themselves: institution EUMETSAT/CMSAF, title "Surface Solar Radiation
  Climate Data Record using Heliosat, Edition 2 (SARAH-2); CM SAF".'
