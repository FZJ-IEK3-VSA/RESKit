title: RESKit Global Wind Atlas 3 test fixtures, Aachen
description: Mean wind speed at 50, 100 and 200 m over a 150 x 150 cell, 0.01 degree
  box around Aachen, plus a correction-factor raster derived from the 100 m layer.
ethos:remote_prefix: reskit-test-data/global-wind-atlas
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'Global Wind Atlas 3.0 resampled to the 0.01 degree test grid. At
  every one of the 22 500 pixels gwa50 < gwa100 < gwa200, which is wind shear and
  not something a generator produces by accident; the nodata value -999 is the GWA
  3.0 idiom, where 4.0 uses nan.

  dummy_correction_factors.tif is NOT synthetic despite its name. It is gwa100-like.tif
  divided by its own maximum -- verified to a maximum absolute difference of 3e-8
  across the grid, which is float32 rounding.'
