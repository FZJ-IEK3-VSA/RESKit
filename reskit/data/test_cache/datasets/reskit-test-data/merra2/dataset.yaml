title: RESKit MERRA-2 test fixtures, Aachen
description: MERRA-2 surface fields over a 3 x 4 cell box around Aachen, 71 hours
  of January 2015, one file per variable. `merged/` holds the same data with the eleven
  variables merged into one file.
ethos:exclude:
- '**/__init__.py'
ethos:remote_prefix: reskit-test-data/merra2
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'Collections M2T1NXRAD and M2T1NXSLV v5.12.4, pulled through the
  GES DISC subsetter in 2017 (`MERRA2_400.tavg1_2d_rad_Nx.*.SUB.nc4`), merged, split
  by variable in 2018, then `cdo -seltimestep,1/71 -sellonlatbox,5.2,7.2,49.7,51.7`
  in 2019.

  merged/merra-like.nc4 is held in a subdirectory for the same scanning reason as
  the `era5-csp` single-cell file: a differently shaped file beside the per-variable
  ones would be picked up by the same directory glob.'
