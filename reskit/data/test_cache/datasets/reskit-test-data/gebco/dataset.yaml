title: RESKit GEBCO bathymetry test fixture, German Bight
description: Water depth over a 24 x 24 cell, 0.01 degree box in the German Bight,
  used by the offshore wind cost model.
ethos:remote_prefix: reskit-test-data/gebco
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'Resampled from a GEBCO grid to 0.01 degree. The product family
  is certain from the SeaDataNet vocabulary the file carries -- sdn_parameter_urn
  SDN:P01::BATHHGHT, sdn_uom_urn SDN:P06::ULAA -- and RESKit''s own docstring names
  gebco.net as the source. The release is NOT pinned: GEBCO_2020 does not reproduce
  the values (RMSE about 1 m under every resampling method tried), so this came from
  some other release. Public domain in every release, so nothing turns on it.'
