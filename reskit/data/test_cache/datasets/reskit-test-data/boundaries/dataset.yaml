title: RESKit administrative boundary test fixtures
description: 'The two administrative polygons the test fixtures are built around:
  Staedteregion Aachen and the city of Bulawayo, Zimbabwe. Both replaced GADM originals
  on 2026-09-09.'
ethos:remote_prefix: reskit-test-data/boundaries
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'aachenShapefile.* is the Kreis with AGS 05334 from BKG VG250, reprojected
  from UTM32 to EPSG:4326 and written as a 5-part multipolygon. Symmetric difference
  against the upstream feature is exactly zero.

  cityBulawayoInZimbabwa.* is the province with pcode ZW10 from the OCHA/ZIMSTAT Common
  Operational Dataset, already in EPSG:4326. Symmetric difference against upstream
  exactly zero.

  Each feature carries `source` and `licence` in its own attribute table, so the terms
  travel with the geometry rather than only with this descriptor.'
