title: RESKit distance-to-coast test fixture, German Bight
description: Distance to the nearest coastline in kilometres over the same 24 x 24
  cell box as the bathymetry fixture.
ethos:remote_prefix: reskit-test-data/dist2coast
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: Cut from the 0.01 degree grid catalogued as `dist2coast`, which
  NASA OBPG computed with the Generic Mapping Tools against the GSHHG intermediate-resolution
  coastline. All 576 pixels equal the upstream subset; only the extent and the container
  (netCDF to GeoTIFF) changed.
