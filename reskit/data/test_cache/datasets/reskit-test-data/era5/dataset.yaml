title: RESKit ERA5 test fixtures, Aachen
description: ERA5 single-level fields over an 11 x 13 cell box around Aachen, 140
  hourly steps from 2015-01-01 00:00 to 2015-01-06 19:00 UTC, including four snow
  variables on the same steps. What RESKit's wind and PV workflow tests read as their
  weather input.
ethos:exclude:
- '**/__init__.py'
ethos:remote_prefix: reskit-test-data/era5
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'Downloaded from the Copernicus Climate Data Store with grib_to_netcdf
  off a MARS adaptor, then `cdo sellonlatbox,5.0,7.5,49,52` and `cdo seltimestep,0/140`.

  Two vintages, and the date matters for which licence applied at download time: most
  files were cut on 2020-04-23 from a 2020-01-30 download, under the Licence to Use
  Copernicus Products; the four raw wind components were re-downloaded 2026-02-05
  (grib_to_netcdf 2.42.0) and the four snow variables added 2026-06-25, under CC BY
  4.0, which replaced it on 2025-07-02. Both permit redistribution with attribution,
  so one licence entry covers the directory.'
