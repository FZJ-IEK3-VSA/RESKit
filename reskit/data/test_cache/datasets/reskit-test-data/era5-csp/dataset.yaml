title: RESKit ERA5 and ERA5-Land test fixtures, Morocco
description: The same ERA5 chain cut to a box off West Africa and Morocco, where concentrating
  solar power is worth simulating. `single-cell/` holds a 2 x 2 cell, 8761-hour file
  that also draws on ERA5-Land.
ethos:remote_prefix: reskit-test-data/era5-csp
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: '`cdo sellonlatbox,-24.5,2.0,19.94,42.98` over the ERA5 download
  described in the sibling `era5` member.

  single-cell/era5_testdata_for_csp_tests.nc mixes in ERA5-Land -- its ws10 long_name
  reads "Processed from ERA5:u10,v10,u100,v100,blh,fsr and ERA5-Land:u10v10". It sits
  in a subdirectory because RESKit''s NCSource globs a directory non-recursively,
  and a 2 x 2 file beside the 5 x 7 ones would be swept into the same scan.'
