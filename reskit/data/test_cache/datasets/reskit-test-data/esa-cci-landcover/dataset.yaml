title: RESKit ESA CCI land cover test fixtures, Aachen and Bulawayo
description: 'Two 300 m land cover clips, over Aachen and over Bulawayo, cut from
  the 2015 layer of the ESA CCI Land Cover v2.0.7 series distributed by CEDA. Publishable:
  CEDA''s terms grant use to any user for any purpose.'
ethos:remote_prefix: reskit-test-data/esa-cci-landcover
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'Both files are grid-aligned subsets of ESACCI-LC-L4-LCCS-Map-300m-P1Y-2015-v2.0.7.tif
  -- the LCCS class layer on the product''s native global 300 m grid (129600 x 64800,
  origin -180/90, 1/360 deg) -- downloaded from CEDA on 2026-09-16 and verified byte-for-byte
  against the copy catalogued as `esa-cci-landcover`, sha256 5f0030bb0645acae41f7bbc4787e815d57e8034e6d102a458edbf77f568e98e8.
  No resampling, no reprojection, no class remapping: each clip is an integer pixel
  window read straight out of that grid, so its cells are the product''s own cells.

  ESA_CCI_2015_clip.tif is srcWin 66780 13860 540 540, i.e. 5.5-7.0 E by 50.0-51.5
  N. 18 LCCS classes.

  ESA_CCI_2015_clip_cityBulawayoInZimbabwa.tif is srcWin 74994 39586 170 131 over
  Bulawayo. 16 LCCS classes.

  Both windows are the extents the superseded 2018 clips had, reused exactly so the
  only variable is the source year: the pixel offsets came out integral to within
  0 and 7e-12 of a cell, which also confirms the old clips were cut from this same
  global grid. Against the 2018 clips 0.84% of cells differ over Aachen and 1.19%
  over Bulawayo, and the set of classes present is identical in both.

  Its extent still follows the old GADM outline; if it is re-cut again, cut it to
  the OCHA boundary now shipped in the `boundaries` member.'
