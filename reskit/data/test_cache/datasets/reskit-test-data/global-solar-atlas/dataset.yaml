title: RESKit Global Solar Atlas test fixtures
description: Long-term average global horizontal and direct normal irradiation over
  Aachen, and direct normal irradiation with air temperature over Morocco for the
  CSP workflows.
ethos:remote_prefix: reskit-test-data/global-solar-atlas
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'Clipped from the Global Solar Atlas. gsa-ghi-like.tif and gsa-dni-like.tif
  are 180 x 180 at 30 arcsec over Aachen; csp-gsa-dni-like.tif is 400 x 600 at the
  product''s native 250 m over Morocco, and csp-gsa-temp-like.tif 120 x 180 at 30
  arcsec over the same window.

  gsa-dni-like.tif is byte-identical to a stray file under the `global-solar-atlas-v1.0`
  dataset''s source_dir, which excludes its copy and points here.'
