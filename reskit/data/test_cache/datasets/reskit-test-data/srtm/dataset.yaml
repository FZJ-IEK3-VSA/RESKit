title: RESKit SRTM elevation test fixture, Aachen
description: A 144 x 144 cell elevation model at 1/96 degree over the Aachen test
  box, resampled from SRTM 1 arc-second.
ethos:remote_prefix: reskit-test-data/srtm
ethos:access: public
ethos:visibility: public
ethos:origin: derived
ethos:derivation: 'SRTM 1 arc-second resampled to 1/96 degree (37.5 arcsec). Identified
  from its registration rather than its resolution: the corner sits exactly 0.5 arcsec
  off the whole degree, which is what a node-registered 1 arcsec grid gives, and the
  nodata value -32768 is SRTM''s void marker. Verified against SRTMGL1 pulled from
  ESA''s STEP server: mean bias -0.003 m, RMSE 2.70 m, 94.6% of cells within 5 m.

  The -193 m minimum is the floor of the Hambach open-pit lignite mine, not an error.'
