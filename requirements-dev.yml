name: reskit_env
channels:
  - conda-forge
dependencies:
  - python >=3.10,<=3.12.12
  - papermill
  - jupyter
  - pip
  - matplotlib
  - descartes
  - pandas >=1.4.0,<=2.3.3
  - openpyxl
  - numpy >=1.21.5,<=1.26.4
  - numba >=0.55,<=0.62.1
  - scipy >=1.7.2,<=1.14.1
  - scikit-learn >=1.3.0,<=1.7.1
  - geokit >=1.4.0,<=1.6.0
  - netCDF4 >=1.5.8,!=1.6.3,<=1.7.3
  - xarray >=0.16.0,<=2025.11.0
  - pvlib-python =0.9.0
  - windpowerlib =0.2.1
  - cdsapi
  # dev
  - nbval
  - ruff
  - pytest
  - pytest-cov
  - pytest-xdist
  # Documentation
  - jupyter-book <2.0
  - sphinx-autoapi
  - codespell
