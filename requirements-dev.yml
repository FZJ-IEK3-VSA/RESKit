name: reskit_env
channels:
  - conda-forge
dependencies:
  - python >=3.11,<=3.12.12
  - papermill <=2.7.0
  - jupyter <=1.1.1
  - pip <=26.1.2
  - matplotlib <=3.10.5
  - descartes <=1.1.0
  - pandas >=2.0.0,<=2.3.3
  - openpyxl <=3.1.5
  - numpy >=1.25.0,<=2.5.1
  - numba >=0.58.1,<=0.66.0
  - scipy >=1.9.3,<=1.14.1
