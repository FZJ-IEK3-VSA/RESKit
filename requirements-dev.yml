name: reskit_env
channels:
  - conda-forge
dependencies:
  - python >=3.10,<=3.12.12
  - papermill
  - jupyter
  - pip
  - matplotlib
  - descartes
  - pandas
  - openpyxl
  - numpy >=1.12.0,<=1.26.4
  - numba
  - scipy >=1.2.0,<=1.14.1
  - scikit-learn
  - geokit >=1.4.0
  - netCDF4 >=1.5.3
  - xarray
  - pvlib-python =0.9.0
  - windpowerlib =0.2.1
  - cdsapi
  # dev
  - nbval
  - ruff
  - pytest
  - pytest-cov
  - pytest-xdist
  # Documentation
  - jupyter-book <2.0
  - sphinx-autoapi
  - codespell
