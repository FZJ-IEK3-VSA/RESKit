name: reskit_env
channels:
  - conda-forge
dependencies:
  - python >=3.10
  - papermill
  - jupyter
  - pip
  - matplotlib
  - descartes
  - pandas <2.2.3
  - openpyxl
  - numpy
  - numba
  - scipy <=1.8.1
  - scikit-learn
  - geokit >=1.4.0
  - netCDF4 >=1.5.3
  - xarray
  - pvlib-python =0.9.0
  - windpowerlib
  - cdsapi
  # dev
  - nbval
  - ruff
  - pytest
  - pytest-cov
  - pytest-xdist
  # Documentation
  - jupyter-book <2.0
  - sphinx-autoapi
  - codespell
